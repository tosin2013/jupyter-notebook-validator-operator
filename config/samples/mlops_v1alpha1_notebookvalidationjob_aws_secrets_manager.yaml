# Example: NotebookValidationJob with AWS Secrets Manager via External Secrets Operator (ESO)
#
# This example demonstrates using ESO to pull credentials from AWS Secrets Manager
# and inject them as environment variables into the validation pod.
#
# Prerequisites:
#   1. External Secrets Operator installed (OperatorHub or Helm)
#   2. AWS Secrets Manager secret created (e.g., "prod/ml-api-keys")
#   3. ESO SecretStore or ClusterSecretStore configured for AWS
#   4. IRSA (IAM Roles for Service Accounts) configured for ESO's service account
#
# See docs/how-to/NOTEBOOK_CREDENTIALS_GUIDE.md for the full AWS integration guide.

# Step 1: Create an ExternalSecret that syncs from AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ml-api-credentials
  namespace: notebook-validation
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ml-api-credentials
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: prod/ml-api-keys
        property: api_key
    - secretKey: API_SECRET
      remoteRef:
        key: prod/ml-api-keys
        property: api_secret
    - secretKey: MODEL_ENDPOINT
      remoteRef:
        key: prod/ml-api-keys
        property: model_endpoint
---
# Step 2: Create the NotebookValidationJob referencing the synced secret
apiVersion: mlops.mlops.dev/v1alpha1
kind: NotebookValidationJob
metadata:
  name: validate-with-aws-secrets
  namespace: notebook-validation
spec:
  notebook:
    path: notebooks/model-inference-test.ipynb
    git:
      url: https://github.com/org/ml-notebooks.git
      ref: main
  podConfig:
    image: quay.io/jupyter/scipy-notebook:latest
    # credentials shorthand: injects all keys from the ESO-synced secret as env vars
    credentials:
      - ml-api-credentials
  timeout: "15m"
