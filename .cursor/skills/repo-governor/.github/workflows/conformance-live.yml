name: conformance (live)

# THREE suites are not hermetic, and they go red for unlike reasons.
#
#   hooks    line 163 runs engine/completion.py against the LIVE BOARD, so its
#            verdict depends on an issue's current milestone and assignee --
#            facts that change with no commit. Nobody fixes this; it self-heals
#            when the board moves back, or it is a real regression.
#
#   install  asks the REMOTE whether the tag the README tells people to clone
#            actually exists (issue 178). It goes red for the WINDOW between a
#            version bump merging and the tag being cut, and a HUMAN closes it
#            by tagging. It is not noise and it does not self-heal.
#
#   roadmap  asks the TRACKER which open issues are milestoned AND assigned --
#            authorized -- and fails any that declare no acceptance criteria.
#            Like `hooks` it moves with the board and not with a commit, but
#            unlike `hooks` it does NOT self-heal: a human closes it by writing
#            the bar, or by removing the milestone from work that is not
#            actually committed. Both are admission acts and neither is code.
#
# Reading one as the other is the trap. A job named only for `hooks` reporting
# `FAILED: install` teaches whoever sees it that live red means "someone moved a
# card" -- which is how a check stops being read.
#
# It is deliberately NOT a `continue-on-error` job inside conformance.yml. A
# continue-on-error job reports SUCCESS to the checks API; its failure shows
# only as a small annotation inside a green run. That is a check whose failure
# is indistinguishable from a pass, which is the defect this repository keeps
# writing checks to prevent -- adding a third instance of it, in the workflow
# whose purpose is to stop them, would be self-defeating.
#
# So: a separate workflow, with no `pull_request` trigger. Red stays honestly
# red, and a board edit never lands a red X on somebody's pull request.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  live:
    name: live (board and remote)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # hooks.py runs tools/install-skill.sh into temp repos several times,
          # and that clones this checkout. install.py needs the tags.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: live conformance (hooks, install, roadmap)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/run-conformance.sh --live
      - name: Say which suite broke
        if: failure()
        run: |
          {
            echo "### a live suite is red"
            echo
            echo "Four very different causes, and the distinction matters:"
            echo
            echo "- **\`install\` — the README names a tag that does not exist yet.**"
            echo "  Expected between a version bump merging and the release being cut."
            echo "  A HUMAN closes it by tagging; it will not self-heal. If no release"
            echo "  is in flight, the install docs are wrong and that IS a defect."
            echo "- **Board state.** hooks runs the engine against a live issue. If that"
            echo "  issue's milestone or assignee moved, this is not a code defect and"
            echo "  no commit caused it."
            echo "- **\`roadmap\` — an AUTHORIZED issue with no acceptance record.**"
            echo "  Milestoned and assigned means cleared to execute; with no bar,"
            echo "  STOP_COMPLETE is unreachable and the work can only be abandoned."
            echo "  A HUMAN closes it: write the bar, or drop the milestone. Not code."
            echo "- **The installer half.** Everything below hooks.py's capture block is"
            echo "  hermetic -- it drives tools/install-skill.sh into temp repositories"
            echo "  and pins the host templates. A failure there IS a code defect."
            echo
            echo "Open the step log and read WHICH SUITE failed before concluding any."
          } >> "$GITHUB_STEP_SUMMARY"
