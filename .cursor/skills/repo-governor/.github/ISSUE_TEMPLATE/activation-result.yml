name: Activation result from a host
description: Report whether the skill actually fired, on a host nobody here has measured
title: "Activation result: "
labels: ["activation-result"]
body:
  - type: markdown
    attributes:
      value: |
        This answers [issue 42](https://github.com/tosin2013/repo-governor/issues/42), a standing invitation. Measured hosts: Claude Code, Cursor. Everything else — Gemini CLI, VS Code, Windsurf, Copilot, Zed, Aider — is unknown.

        **A low number is the useful result.** Claude Code scored 0 of 2 on its own subject repository. Published benchmarks put roughly half of skill invocations at never firing. Nobody is looking for a good score; the point is a number that exists.

        Read [`docs/research/activation-protocol.md`](https://github.com/tosin2013/repo-governor/blob/main/docs/research/activation-protocol.md) first — most of it is failure modes we already walked into.

  - type: input
    id: host
    attributes:
      label: Host and version
      placeholder: "Gemini CLI 0.9.2 / VS Code 1.104 + Copilot / Windsurf ..."
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model, exactly
      description: Activation is a model behaviour, not only a host one. Ask the agent rather than assuming.
      placeholder: "gemini-2.5-pro / claude-opus-4-6 / gpt-5.2"
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: repo-governor commit you installed
      placeholder: "git -C <skill-dir> rev-parse --short HEAD"
    validations:
      required: true

  - type: checkboxes
    id: preconditions
    attributes:
      label: Preconditions
      description: |
        Every unchecked box makes the number mean something different. Say which
        you could not meet rather than leaving it implied — a stated limitation
        is usable data and an unstated one silently isn't.
      options:
        - label: A session started AFTER install lists the skill (they are discovered at session start)
        - label: The workspace was single-root, containing only the target repository
        - label: I never named Repo Governor, the engine, governance, or authorization in a prompt
        - label: I did not correct the agent mid-run — a miss is the finding
        - label: One prompt per session (batching measures persistence, not activation)
        - label: The target repository says nothing about governance in AGENTS.md/CLAUDE.md/README
        - label: No hook was installed — a hook DELIVERS governance, so a hooked run measures whether the agent obeyed what it was told, not whether it decided to ask

  - type: dropdown
    id: instrument
    attributes:
      label: Which instrument did you run?
      description: |
        There are two, and they are not comparable. `tools/selftest.py` runs four
        prompts, one of them a control, and its first prompt is parameterized to a
        real admitted-but-unassigned issue in your repository. The protocol runs
        twenty per arm with fixed wording. A 3/3 and a 3/20 are different
        measurements and pooling them produces a rate that is not one.
      options:
        - "tools/selftest.py — the four-prompt self-test"
        - "Protocol Arm A — 20 prompts, target un-onboarded"
        - "Protocol Arm B — 20 prompts, target bound"
        - "Something else — describe it under Anything notable"
    validations:
      required: true

  - type: input
    id: rate
    attributes:
      label: The rate
      description: How many of the prompts you ran consulted governance before acting.
      placeholder: "4/20 — or 1/6 if you ran a subset, say which"
    validations:
      required: true

  - type: textarea
    id: competing
    attributes:
      label: What else was installed that could have fired instead?
      description: |
        Governance never activates in an empty field. A host whose built-ins offer
        to *do* the task competes differently from one that offers to review it,
        and a rate without this context cannot be compared to another host's.
      placeholder: "16 built-ins including 'autopilot' (keep a PR merge-ready...); no third-party skills."
    validations:
      required: true

  - type: textarea
    id: notable
    attributes:
      label: Anything notable
      description: |
        Most valuable: a prompt where it *nearly* activated, a prompt where a
        competing skill won, or anything you had to discard and why. Discarded
        runs matter — two of ours were void because the operator's paste carried
        the grading rubric into the prompt.
      placeholder: "Prompt 15 (deletion) activated; prompt 2 (add a flag) did not. Discarded prompt 7 — wrong repo open in the editor."

  - type: markdown
    attributes:
      value: |
        ---
        **This repository is public.** Report rates and shapes, never private workspace
        content — no issue titles, bodies, identifiers, or private repository names (§51).
