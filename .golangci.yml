# golangci-lint version pinned in Makefile and .github/workflows/ci.yml
# To add a justified gosec suppression use an inline comment on the flagged line:
#   someFunc() // #nosec G204 - <one-line rationale explaining why it is safe>
# Never use a bare #nosec without a rule ID and rationale.

version: "2"

run:
  timeout: 5m
  allow-parallel-runners: true

linters:
  default: none
  enable:
    - dupl
    - errcheck
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - staticcheck
    - unconvert
    - unparam
    - unused
    # typecheck: built into the v2 runner, cannot be listed
    # gosimple: merged into staticcheck in v2
  settings:
    goconst:
      min-len: 5  # Filter short generic strings ("true", "none", "apps")
      min-occurrences: 5
      match-constant: false  # Don't match against existing constants
      numbers: false  # Don't check for repeated numbers
      min: 3
      max: 3
    lll:
      line-length: 200  # Increased to accommodate detailed error messages, URLs, and function signatures
      tab-width: 1
  exclusions:
    # No presets — we define all exclusion rules explicitly
    rules:
      - path: "api/*"
        linters:
          - lll
      - path: "internal/*"
        linters:
          - dupl
      # Exclude lll for webhook files (kubebuilder annotations are very long)
      - path: "_webhook\\.go$"
        linters:
          - lll
      # Exclude lll and goconst for test files (test data can be long,
      # repeated string literals in test tables are idiomatic Go)
      - path: "_test\\.go$"
        linters:
          - lll
          - goconst
      # Suppress k8s.io import noise across all linters
      - text: "could not import k8s.io"
        path: ".*\\.go"

formatters:
  enable:
    - gofmt
    - goimports
