site_name: Jupyter Notebook Validator Operator
site_url: https://tosin2013.github.io/jupyter-notebook-validator-operator/
site_description: >-
  Catch notebook regressions and broken model endpoints before they reach
  production. Validate Jupyter notebooks in Kubernetes with golden baseline
  comparison and ML model endpoint validation.
site_author: tosin2013
repo_url: https://github.com/tosin2013/jupyter-notebook-validator-operator
repo_name: tosin2013/jupyter-notebook-validator-operator
edit_uri: edit/main/docs/

copyright: >-
  Copyright &copy; 2025-2026 tosin2013.
  <a href="https://github.com/tosin2013/jupyter-notebook-validator-operator/blob/main/LICENSE">Apache 2.0</a>

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - assets/stylesheets/custom.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tosin2013/jupyter-notebook-validator-operator
    - icon: fontawesome/solid/cube
      link: https://operatorhub.io/operator/jupyter-notebook-validator-operator
      name: OperatorHub.io

hooks:
  - docs/hooks/copy_root_docs.py

