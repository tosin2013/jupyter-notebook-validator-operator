apiVersion: v2
name: jupyter-notebook-validator-operator
description: Catch notebook regressions and broken model endpoints before they reach production. Validate Jupyter notebooks in Kubernetes with golden baseline comparison and ML model endpoint validation.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 1.0.10

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "1.0.10"

# Keywords for searching
keywords:
  - jupyter
  - notebook
  - validation
  - mlops
  - machine-learning
  - operator
  - kubernetes
  - openshift
  - tekton
  - papermill

# Home page URL
home: https://github.com/tosin2013/jupyter-notebook-validator-operator

# Source code URLs
sources:
  - https://github.com/tosin2013/jupyter-notebook-validator-operator

# Maintainers
maintainers:
  - name: Tosin Akinosho
    email: tosin.akinosho@gmail.com
    url: https://github.com/tosin2013

# Icon URL
icon: https://raw.githubusercontent.com/tosin2013/jupyter-notebook-validator-operator/main/images/small-logo.png

# Chart dependencies (if any)
dependencies: []
# Example: If you want to bundle Tekton or other charts
# - name: tekton-pipelines
#   version: "0.65.0"
#   repository: "https://charts.tekton.dev"
#   condition: tekton.enabled

# Kubernetes version constraint
kubeVersion: ">=1.31.0-0"

# Annotations for Artifact Hub / Helm Hub
annotations:
  # Category for Artifact Hub
  artifacthub.io/category: integration-delivery
  
  # Changes in this version
  artifacthub.io/changes: |
    - kind: changed
      description: Upgrade k8s.io client libraries to v0.35.x for OCP 4.22 / Kubernetes 1.35
    - kind: changed
      description: Upgrade controller-runtime to v0.23.3 with generic webhook interfaces
    - kind: added
      description: NotebookValidationJob printer columns for kubectl get (Phase, Notebook, Git-URL, Timeout, Age, Message)
    - kind: added
      description: AWS Secrets Manager and IRSA credential injection documentation and examples
    - kind: added
      description: AWS EBS and EFS StorageClass documentation and sample CRs
    - kind: added
      description: OLM v1 strategy documentation (OLM Classic vs OLM v1 comparison)
    - kind: added
      description: Pod recovery and model validation integration tests (ADR-026, ADR-020)
    - kind: added
      description: Tekton git credentials auto-sync smoke test (ADR-042)
    - kind: changed
      description: OpenShift certified window updated to 4.20, 4.21, 4.22 per ADR-056
    - kind: added
      description: E2E verified on OCP 4.22.13 ROSA HCP cluster
  
  # Links
  artifacthub.io/links: |
    - name: Documentation
      url: https://tosin2013.github.io/jupyter-notebook-validator-operator/
    - name: Source Code
      url: https://github.com/tosin2013/jupyter-notebook-validator-operator
    - name: ADRs
      url: https://tosin2013.github.io/jupyter-notebook-validator-operator/adrs/
    - name: Changelog
      url: https://github.com/tosin2013/jupyter-notebook-validator-operator/blob/main/CHANGELOG.md
  
  # Operator capabilities (for OperatorHub compatibility)
  artifacthub.io/operator: "true"
  artifacthub.io/operatorCapabilities: "Seamless Upgrades"
  
  # License
  artifacthub.io/license: Apache-2.0
  
  # Container images used
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: jupyter-notebook-validator-operator
      image: quay.io/takinosh/jupyter-notebook-validator-operator:1.0.10
  
  # Recommendations
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/tekton/tekton-pipelines
    - url: https://artifacthub.io/packages/helm/external-secrets-operator/external-secrets
  
  # OpenShift compatibility
  artifacthub.io/openshift: "true"
  
  # Prerelease flag
  artifacthub.io/prerelease: "false"
  
  # Sign key (add when you have GPG signing)
  # artifacthub.io/signKey: |
  #   fingerprint: XXXX
  #   url: https://keybase.io/username/pgp_keys.asc

